# zsh
set-option -g default-shell /bin/zsh

# Set terminal-overrides to ensure tmux works properly with termguicolors in vim
set -ga terminal-overrides ",tmux-256col*:Tc"

# remap leader key to ctrl-a like screeen
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Set titles
set -g set-titles on

# Renumber windows when one is removed
set -g renumber-windows on

# Disable bells of any kind
set -g visual-bell off
set -g bell-action none
